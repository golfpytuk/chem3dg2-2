<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลย์เอาต์ภายในกล่องวงจร 14×14×7 ซม.</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#1a1f26;color:#eceff2;font-family:"Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.p{position:fixed;background:rgba(20,24,30,.9);border:1px solid #333b45;border-radius:12px;padding:8px 10px;font-size:.8rem}
#top{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px;background:none;border:0;padding:0}
button{background:#2e7d32;color:#fff;border:0;border-radius:8px;padding:7px 11px;font:inherit;font-weight:600}
button.off{background:#444b54}
#ls{left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 16px));max-height:34vh;overflow:auto}
#ls summary{font-weight:700;cursor:pointer}
#ls button{display:block;width:100%;text-align:left;background:transparent;border:1px solid #333b45;margin-top:4px;font-weight:400;padding:6px 8px}
#ls button:active,#ls button.on{background:#7a5a00}
#ls small{color:#9aa5b1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="p" id="top">
  <button id="bLid">เปิดฝากล่อง</button>
  <button id="bWire">สายไฟ</button>
  <button id="bLab">ป้ายชื่อ</button>
  <button id="bTop" class="off">มองจากด้านบน</button>
</div>
<details class="p" id="ls" open><summary>รายการชิ้นส่วน (แตะเพื่อไฮไลต์)</summary><div id="list"></div></details>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x1a1f26);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x334455,.9));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(10,25,15);S.add(dl);
const G=new THREE.Group();S.add(G);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o));
const box=(w,h,d,c,x,y,z,p=G,o)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);p.add(m);return m};
const cyl=(r,h,c,x,y,z,p=G,o)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),M(c,o));m.position.set(x,y,z);p.add(m);return m};
const labels=new THREE.Group(),wires=new THREE.Group();G.add(labels,wires);
function label(t,x,y,z,w=7){const c=document.createElement('canvas');c.width=400;c.height=64;const g=c.getContext('2d');
  g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,400,64);g.fillStyle='#fff';g.font='bold 28px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,200,34);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(w,w*.16,1);s.position.set(x,y,z);labels.add(s)}
function wire(pts,col){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'catmullrom',.15);
  wires.add(new THREE.Mesh(new THREE.TubeGeometry(c,40,.07,6),M(col)))}
const comps=[];
function comp(n,name,dim,x,z){const g=new THREE.Group();g.position.set(x,1,z);G.add(g);comps.push({n,name,dim,g});return g}
function stand(g,w,d){[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(a=>cyl(.2,.6,0xd4af37,a[0]*(w/2-.3),-.3,a[1]*(d/2-.3),g))}

// Box 14x14x7
box(14,.4,14,0x8f99a4,0,.2,0);
const glass={transparent:true,opacity:.16,roughness:.2};
[[0,3.7,-7,14,7,.3],[0,3.7,7,14,7,.3],[-7,3.7,0,.3,7,14],[7,3.7,0,.3,7,14]].forEach(a=>box(a[3],a[4],a[5],0xb7c0ca,a[0],a[1],a[2],G,glass));
const lid=new THREE.Group();lid.position.y=7.2;G.add(lid);
box(14,.4,14,0xb7c0ca,0,0,0,lid,glass);
[[-6.4,-6.4],[6.4,-6.4],[-6.4,6.4],[6.4,6.4]].forEach(p=>{cyl(.3,.5,0x555,p[0],.3,p[1],lid);cyl(.18,6.8,0x222,p[0],-3.4,p[1],lid)});
box(2,.3,2,0xd0d5da,0,.35,0,lid);

// 1 Arduino UNO 6.9x5.3
let g=comp(1,'Arduino UNO','6.9×5.3 ซม. ยกสูง 0.5 ซม. บนน็อตยึดมุม 4 ตัว',-3.05,-3.85);
box(6.9,.15,5.3,0x1f7a4a,0,0,0,g);stand(g,6.9,5.3);box(1.6,.9,1.4,0x999,-2.9,.5,-1.2,g);box(1.2,.7,.9,0x111,-3.1,.4,1.5,g);
box(5,.35,.3,0x111,.2,.25,-2.4,g);box(5,.35,.3,0x111,.2,.25,2.4,g);

// 2 Relay x2 5.2x2.6
g=comp(2,'โมดูลรีเลย์ 2 ช่อง','5.2×2.6×1.7 ซม. — CH1 ปั๊ม 1 (D3), CH2 ปั๊ม 2 (D4)',3.6,-5.2);
box(5.2,.15,2.6,0x1a40b0,0,0,0,g);stand(g,5.2,2.6);box(1.6,1.5,1.7,0x2255cc,-1.2,.8,-.2,g);box(1.6,1.5,1.7,0x2255cc,1.2,.8,-.2,g);
[-1.8,-1,-.2,.6,1.4,2.2].forEach(x=>box(.45,.5,.5,0x1b5e20,x,.3,1.05,g));
box(.4,.2,.4,0xff2222,-.2,.2,-1.1,g,{emissive:0x440000});box(.4,.2,.4,0xff2222,2.2,.2,-1.1,g,{emissive:0x440000});

// Buck LM2596 6.2x3.2
g=comp(3,'โมดูลลดแรงดัน LM2596 (7.4V→5V)','6.2×3.2 ซม. + จอโวลต์มิเตอร์',3.5,-1.9);
box(6.2,.15,3.2,0x1b5fb0,0,0,0,g);stand(g,6.2,3.2);box(2.0,.4,1.0,0x080808,.4,.3,0,g,{emissive:0x330000});cyl(.45,.8,0x777,-1.9,.45,-.9,g);box(1.1,.7,1.1,0x222,1.8,.4,-1,g);

// 4 Battery pack 7.6x4.0x2.1 + BMS + 5 switch
g=comp(4,'ชุดแบต Li-ion 18650 ×2 (7.4V)','7.6×4.0×2.1 ซม. + BMS 2S (4.6×1.9 ซม.)',-2.8,1.4);g.position.y=.4;
box(7.6,2.1,4,0x15171a,0,1.05,0,g);[-.95,.95].forEach(z=>{const c=cyl(.8,6.6,0xb9c2cc,0,2.15,z,g);c.rotation.z=Math.PI/2});
const bms=comp(4,'','',3.5,1.25);box(4.6,.15,1.9,0x1d5fb4,0,0,0,bms);stand(bms,4.6,1.9);box(.9,.4,.7,0x111,-.9,.3,.2,bms);box(.9,.4,.7,0x111,.5,.3,.2,bms);comps.pop();
g.userData.extra=bms;
const sw=comp(5,'สวิตช์เปิด-ปิด (Rocker KCD1)','ยึดที่ผนังด้านหน้า ใช้ตัดไฟ P+ ก่อนเข้า Arduino/Buck',-4.5,6.4);sw.position.set(-4.5,3.2,6.3);
box(2.1,1.5,1.2,0x0c0c0c,0,0,0,sw);box(1.8,.3,.3,0x333,0,0,.8,sw);

// 6 Charger Type-C 3.3x2.3
g=comp(6,'โมดูลชาร์จ Type-C (IP2326 2S)','3.3×2.3 ซม. — พอร์ต Type-C หันออกผนังขวา',4.95,4.1);
box(3.3,.15,2.3,0x15171a,0,0,0,g);stand(g,3.3,2.3);box(.9,.9,.9,0x222,-.3,.5,0,g);box(1.0,.35,1.1,0xc0c6cc,1.4,.28,0,g);
box(.2,1,1.2,0x080808,6.6,1.8,4.1).position.x=6.95;

// 7 Terminal block 4 pins
g=comp(7,'ขั้วต่อสาย 4 ช่อง','5.0×1.0 ซม. สำหรับสายเซนเซอร์ (A0, 5V, GND)',-0.5,5.9);
box(5,.8,1,0x2a6fe0,0,.4,0,g);[-1.8,-.6,.6,1.8].forEach(x=>cyl(.25,.15,0x999,x,.85,0,g));

// 8 cable glands (left wall)
const gl=comp(8,'รูร้อยสาย 3 รู + ยางกันน้ำ','ผนังซ้าย: สายเซนเซอร์ + ปั๊ม 1 + ปั๊ม 2',-7,0);gl.position.set(-7,3.5,0);
[-3,1,5].forEach(z=>{const c=cyl(.55,.9,0xe0e0e0,0,0,z,gl);c.rotation.z=Math.PI/2});

// 9 LED status (front wall)
const led=comp(9,'LED แสดงสถานะ','ที่ผนังด้านหน้า มองเห็นจากภายนอก',4.5,6.9);led.position.set(4.5,3.5,6.9);
const ledM=cyl(.45,.5,0x1b8a2a,0,0,0,led,{emissive:0x0a5a14});led.children[0].rotation.x=Math.PI/2;

// 10 lid
const lc=comp(10,'ฝากล่อง 14×14 ซม. + ปะเก็นกันน้ำ','ยึดด้วยน็อต 4 มุม',0,0);lc.add(lid);G.remove(lid);lc.position.set(0,0,0);lc.add(lid);lid.position.y=7.2-1;

// Pad coordinates
const P={bat:[1.1,2.0,.5],batm:[1.1,2.0,1.4],batn:[1.1,2.0,2.3],Bp:[1.4,1.25,.7],Bn:[1.4,1.25,1.9],H3:[5.6,1.25,.7],Pp:[5.6,1.25,1.4],Pn:[5.6,1.25,2.0],
 Cp:[3.4,1.3,3.4],Cn:[3.4,1.3,4.6],S1:[-4.9,3.2,5.6],S2:[-4.1,3.2,5.6],VIN:[-3.5,1.7,-1.4],GND:[-2.7,1.7,-1.4],A0:[-.4,1.7,-1.4],
 I1:[.7,1.7,-2.5],I2:[.7,1.7,-1.3],O1:[6.3,1.7,-2.5],O2:[6.3,1.7,-1.3],D3:[-1.2,1.7,-6.3],D4:[-.6,1.7,-6.3],D8:[-1.8,1.7,-6.3],
 R1:[1.1,1.7,-5.6],R2:[1.1,1.7,-4.9],C1:[2.4,1.8,-4.1],C2:[4.8,1.8,-4.1],N1:[3.2,1.8,-4.1],N2:[5.6,1.8,-4.1],T:[-.6,1.9,5.9]};
const red=0xd32f2f,blk=0x111111;
wire([P.bat,[0,3,.5],P.Bp],red);wire([P.batn,[0,2.6,2.3],P.Bn],blk);wire([[-2.8,2.4,.4],[0,4,-.5],[3,3.6,.2],P.H3],0x2ecc40);
wire([P.Cp,[4.8,2.4,2.8],P.Pp],red);wire([P.Cn,[5,2.2,3],P.Pn],blk);
wire([P.Pp,[5,3,-.2],[-1,4.2,5.3],P.S2],red);wire([P.S1,[-4,4.4,2],[-3.6,3,-.8],P.VIN],red);
wire([P.S1,[-3,4.6,4],[-1,4,-1],P.I1],red);wire([P.Pn,[3,2,-.4],P.I2],blk);wire([P.I2,[-1,2.2,-1],P.GND],blk);
wire([P.O1,[6.6,3.5,-3.4],[3.8,3.2,-4.4],P.C2],red);wire([P.C2,[3.6,3,-4.5],P.C1],red);
wire([P.D3,[0,2.6,-6.4],P.R1],0xf9a825);wire([P.D4,[.2,2.4,-5.5],P.R2],0x8e24aa);
wire([P.A0,[-.5,3,2],P.T],0x00897b);
wire([P.N1,[-3,5,-4.4],[-6.3,4,-3]],0x1e88e5);wire([P.N2,[-3,5.4,-3.6],[-6.3,3.8,1]],0x43a047);
wire([P.T,[-3,2.4,5.2],[-6.3,3.6,5]],0x00897b);wire([P.D8,[-2,3.8,5],[4.5,3.8,6.3]],0x66bb6a);

// Labels
[['1 Arduino UNO',-3,4,-4],['2 รีเลย์ 2 ช่อง',3.6,4,-6],['3 LM2596',3.5,4.2,-1.9],['4 แบต 18650×2 + BMS',-2.8,5.4,1.4],['5 สวิตช์',-4.5,5.2,6.3],
 ['6 ชาร์จ Type-C',5,3.2,4.6],['7 ขั้วต่อ 4 ช่อง',-.5,2.8,6.6],['8 รูร้อยสาย ×3',-7.5,5.2,0],['9 LED',4.5,5.2,6.9]].forEach(a=>label(a[0],a[1],a[2],a[3],a[0].length>14?7.6:5.6));
// Dimensions
const dm=(a,b)=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);G.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xff5252})))};
dm([-7,.1,8.2],[7,.1,8.2]);dm([8.2,.1,-7],[8.2,.1,7]);dm([-8.2,0,7],[-8.2,7,7]);
label('14 ซม.',0,.6,9,4);label('14 ซม.',9.4,.6,0,4);label('7 ซม.',-8.2,3.5,7.9,4);

// List
const lst=document.getElementById('list');
comps.filter(c=>c.name).forEach(c=>{const b=document.createElement('button');b.innerHTML=`<b>${c.n}</b> ${c.name}<br><small>${c.dim}</small>`;
  b.onclick=()=>{hl(c.g,b)};lst.appendChild(b)});
let hlT=0,hlG=null,hlB=null;
function hl(g,b){if(hlG)setEm(hlG,0);if(hlB)hlB.classList.remove('on');hlG=g;hlB=b;b.classList.add('on');hlT=2.5}
function setEm(g,v){if(g.userData.extra)setEm(g.userData.extra,v);g.traverse(o=>{if(o.isMesh&&o.material.emissive&&!o.userData.keep){o.material.emissive.setHex(v)}})}

// UI
let lidOpen=false,lidT=0;
document.getElementById('bLid').onclick=e=>{lidOpen=!lidOpen;e.target.textContent=lidOpen?'ปิดฝากล่อง':'เปิดฝากล่อง'};
document.getElementById('bWire').onclick=e=>{wires.visible=!wires.visible;e.target.className=wires.visible?'':'off'};
document.getElementById('bLab').onclick=e=>{labels.visible=!labels.visible;e.target.className=labels.visible?'':'off'};
document.getElementById('bTop').onclick=()=>{yaw=0;pit=1.5};
let yaw=.5,pit=.9,dist=30;const pts=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size==1){yaw-=(e.clientX-p[0])*.008;pit=Math.max(.1,Math.min(1.55,pit+(e.clientY-p[1])*.008))}
  else{const o=[...pts.entries()].find(([k])=>k!=e.pointerId)[1];dist=Math.max(10,Math.min(70,dist*Math.hypot(p[0]-o[0],p[1]-o[1])/Math.hypot(e.clientX-o[0],e.clientY-o[1])))}
  pts.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointerup',e=>pts.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(10,Math.min(70,dist*(1+e.deltaY*.001)))},{passive:false});
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=(now-last)/1000;last=now;
  lidT+=((lidOpen?1:0)-lidT)*.1;lid.position.y=6.2+1+lidT*10;
  if(hlG){hlT-=dt;setEm(hlG,hlT>0&&Math.floor(now/250)%2?0x886600:0);if(hlT<=0){setEm(hlG,0);hlG=null}}
  const d=innerWidth<innerHeight?dist*1.5:dist;
  cam.position.set(Math.sin(yaw)*Math.cos(pit)*d,Math.sin(pit)*d+3,Math.cos(yaw)*Math.cos(pit)*d);cam.lookAt(0,2,0);R.render(S,cam)})(last);
</script>
</body>
</html>
